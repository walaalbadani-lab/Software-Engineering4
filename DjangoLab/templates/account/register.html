{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل | دعوات الكترونيه🐆</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:"Cairo",Tahoma,sans-serif; background:#ead9c8; }
    body::before { content:""; position:fixed; inset:0; background:url("{% static 'e_invites/22.jpg' %}") center/cover no-repeat; opacity:.16; pointer-events:none; }
    .card { position:relative; width:min(420px,92%); background:rgba(255,248,241,.93); border-radius:28px; padding:28px; box-shadow:0 20px 50px rgba(58,33,24,.15); }
    img { width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid #d7b57a; display:block; margin-bottom:12px; }
    h1 { margin:0 0 8px; font-size:1.6rem; color:#3a2119; }
    .muted { color:#7a5b49; margin-bottom:14px; font-size:.9rem; }
    label { display:block; font-weight:700; margin:12px 0 6px; }
    input { width:100%; padding:11px 13px; border:1px solid #e3d2c1; border-radius:12px; background:#fff; }
    button { width:100%; margin-top:16px; border:0; background:#3a2119; color:#f6eee4; border-radius:999px; padding:12px; font-weight:800; cursor:pointer; }
    .err { color:#9b1c1c; font-size:.9rem; margin-top:10px; }
    .hint { color:#7a5b49; font-size:.8rem; margin-top:4px; }
    a { color:#6a4330; font-size:.9rem; }
  </style>
</head>
<body>
  <section class="card">
    <img src="{% static 'e_invites/22.jpg' %}" alt="_4cioq">
    <h1>تسجيل حساب</h1>
    <p class="muted">دعوات الكترونيه🐆 · _4cioq</p>
    {% if messages %}{% for m in messages %}<p class="err">{{ m }}</p>{% endfor %}{% endif %}
    <form method="post">
      {% csrf_token %}
      <label>اسم المستخدم</label>
      <input type="text" name="username" value="{{ username }}" minlength="3" required>
      <label>البريد الإلكتروني</label>
      <input type="email" name="email" value="{{ email }}" required>
      <label>كلمة السر</label>
      <input type="password" name="password1" minlength="6" required>
      <p class="hint">6 أحرف على الأقل · حروف أو أرقام أو - فقط</p>
      <label>تأكيد كلمة السر</label>
      <input type="password" name="password2" minlength="6" required>
      <button type="submit">إنشاء حساب</button>
    </form>
    <p style="margin-top:12px;"><a href="{% url 'login' %}">لديك حساب؟ دخول</a> · <a href="{% url 'home' %}">الرئيسية</a></p>
  </section>
</body>
</html>
