{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حول | _4cioq</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Cairo", Tahoma, sans-serif;
      color: #2b1812;
      background: #f3e8dc;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("{% static 'e_invites/22.jpg' %}") center / 82vmin no-repeat;
      opacity: .13;
      pointer-events: none;
      z-index: 0;
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(900px, 92%);
      margin: 40px auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 16px;
      background: rgba(58, 33, 25, .9);
      color: #f6eee4;
      padding: 9px 16px;
      border-radius: 999px;
    }

    .card {
      background: rgba(255, 248, 241, .86);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(215, 181, 122, .25);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 18px 42px rgba(47, 27, 20, .10);
      margin-bottom: 18px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 2.3rem;
      margin-bottom: 8px;
    }

    .socials {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .social {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 248, 241, .92);
      border: 1px solid rgba(215, 181, 122, .25);
      border-radius: 22px;
      padding: 16px;
    }

    .mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f9d29d, #b98045);
      font-weight: 900;
    }

    span { color: #8a6a56; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="{% url 'home' %}">الرئيسية</a>

    <section class="card">
      <h1>_4cioq</h1>
      <p>تصاميم رقمية، دعوات، فيديو، وجرائد وورقيات.</p>
    </section>

    <section class="card">
      <h2>تواصل</h2>
      <div class="socials">
        <a class="social" href="https://instagram.com/_4cioq" target="_blank" rel="noopener">
          <div class="mark">IG</div>
          <div>
            <b>Instagram</b><br>
            <span>_4cioq</span>
          </div>
        </a>

        <a class="social" href="https://tiktok.com/@_4cioq" target="_blank" rel="noopener">
          <div class="mark">TT</div>
          <div>
            <b>TikTok</b><br>
            <span>_4cioq</span>
          </div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
