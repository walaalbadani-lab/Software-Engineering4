{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | {{ arabic_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background: #f5eee5; color: #4b3329; }
        
        header { background: #4a3228; padding: 12px 8%; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 15px; color: white; }
        .brand img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #d8b58d; }
        nav a { color: white; text-decoration: none; font-weight: 600; padding: 8px 16px; }

        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 40px 20px; }
        .auth-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 40px rgba(72,46,36,0.1); width: 100%; max-width: 450px; border-top: 6px solid #a77953; }
        .auth-box h2 { text-align: center; color: #4a3228; margin-bottom: 25px; font-weight: 800; }
        
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #573a2d; }
        input { width: 100%; padding: 15px; border: 2px solid #e7d3bc; border-radius: 10px; background: #fdfaf6; font-family: inherit; font-size: 16px; outline: none; }
        input:focus { border-color: #a77953; background: #fff; }
        
        button { width: 100%; padding: 15px; border: 0; border-radius: 10px; background: linear-gradient(135deg, #a77953, #8c5d3a); color: white; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(167,121,83,0.4); }
        
        .reg-link { text-align: center; margin-top: 20px; display: block; color: #573a2d; text-decoration: none; font-weight: 600; }
        .reg-link span { color: #a77953; text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <img src="{% static 'e_invites/22.jpg' %}" alt="شعار">
        <h2>{{ arabic_name|capfirst }}</h2>
    </div>
    <nav>
        <a href="{% url 'e_invites:home' %}">العودة للرئيسية</a>
    </nav>
</header>

<div class="auth-container">
    <form class="auth-box" method="post">
        {% csrf_token %}
        <h2>مرحباً بعودتك</h2>
        
        <div class="field">
            <label>اسم المستخدم أو البريد الإلكتروني</label>
            <input type="text" name="username" placeholder="أدخل اسمك أو بريدك" required>
        </div>
        
        <div class="field">
            <label>كلمة المرور</label>
            <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
        </div>
        
        <button type="submit">دخول للحساب</button>
        
       <a href="{% url 'account:register' %}" class="reg-link">ليس لديك حساب؟ <span>سجل حساب جديد هنا</span></a>
    </form>
</div>

</body>
</html>
